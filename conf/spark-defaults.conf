# conf/spark-defaults.conf - cấu hình Spark CHUNG mà mọi job của đề tài dùng (mục A.5, C.2 đề cương).
#
# Nơi áp dụng thật: ha_tang/spark/submit.sh truyền đúng các khóa dưới đây bằng --conf cho mọi job
# (tests/test_ha_tang.py kiểm tra hai nơi luôn khớp nhau). Cấu hình theo từng hồ sơ job (số lõi,
# RAM executor/driver, số phân vùng shuffle, cổng driver) nằm trong bảng "case" của submit.sh vì
# mỗi loại job (luồng, lô, ALS, bảo trì) cần một mức khác nhau trên máy 7 GB RAM.
#
# Khác với cấu hình tham khảo C.2: cụm chạy Spark Standalone (spark://10.68.71.113:7077) thay vì YARN,
# được đề cương cho phép ở mục A.3 ("submit lên YARN hoặc Spark Standalone").

spark.master                                   spark://10.68.71.113:7077
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.session.timeZone                     UTC
spark.hadoop.dfs.client.use.datanode.hostname  true
spark.hadoop.dfs.client.socket-timeout         180000
spark.task.maxFailures                         8
spark.network.timeout                          300s
spark.executor.heartbeatInterval               30s
spark.shuffle.io.maxRetries                    10
spark.shuffle.io.retryWait                     10s
spark.cleaner.periodicGC.interval              5min
spark.driver.bindAddress                       0.0.0.0
# Giữ tệp cũ 30 ngày, nhật ký 60 ngày cho MỌI bảng Delta mới (đặt trong jobs/common/spark_utils.py
# tao_spark): VACUUM hằng đêm không phá VERSION AS OF của thí nghiệm A/B trong vòng một tháng.
spark.databricks.delta.properties.defaults.deletedFileRetentionDuration  interval 30 days
spark.databricks.delta.properties.defaults.logRetentionDuration          interval 60 days
